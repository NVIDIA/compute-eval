name: Release

# Build the wheel and sdist and publish them as a GitHub Release when a
# version tag is pushed. Only repository maintainers can push tags, so tag
# creation is the release gate. Publishing the release artifacts to PyPI is a
# separate, manual step (via the Kitmaker Portal against the asset URLs below).

on:
  push:
    tags:
      # CalVer tags: 2026.1, 2026.2, 2026.10, and prereleases like 2026.1rc1
      - "[0-9][0-9][0-9][0-9].*"

permissions:
  contents: write  # required to create a GitHub Release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@v4

      - name: Install uv
        run: pipx install uv

      - name: Verify the tag matches the package version
        run: |
          version="$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          if [ "$version" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag '${GITHUB_REF_NAME}' does not match the pyproject version '$version'. Bump the version, sync, and re-tag."
            exit 1
          fi

      - name: Build the wheel and sdist
        run: uv build

      - name: Create the GitHub Release and attach the artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes "Release ${GITHUB_REF_NAME}. See CHANGELOG.md for details." \
            dist/*
